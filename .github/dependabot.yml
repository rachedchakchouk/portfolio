# Dependabot : mises à jour des actions GitHub, hebdomadaires (lundi 06:00, heure de Tunis),
# regroupées en une seule PR ; les alertes de sécurité restent actives.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dépendances"]
    groups:
      securite-actions:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
